<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Tài khoản</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; color: #2c3e50; }
        .main-content { margin-left: 8px; padding: 10px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 28px; color: #2c3e50; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .btn-primary { background: #ff6b35; color: white; }
        .btn-primary:hover { background: #e55a2b; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(255, 107, 53, 0.3); }
        .btn-home { background: white; color: #2c3e50; border: 1px solid #ddd; }
        .alert { padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .stat-card-title { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
        .stat-number { font-size: 36px; font-weight: 700; margin: 10px 0; }
        .stat-card.total { border-left: 4px solid #667eea; }
        .stat-card.admin { border-left: 4px solid #f093fb; }
        .stat-card.employee { border-left: 4px solid #4facfe; }
        .stat-card.customer { border-left: 4px solid #43e97b; }
        .filter-bar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
        .filter-bar > div { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .table-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8f9fa; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { font-size: 13px; color: #7f8c8d; text-transform: uppercase; font-weight: 600; }
        tbody tr:hover { background: #f8f9fa; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 5px; transition: all 0.3s; }
        .btn-view { background: #4facfe; color: white; }
        .btn-view:hover { background: #3d8ee5; }
        .btn-edit { background: #fff3cd; color: #856404; }
        .btn-edit:hover { background: #ffe69c; }
        .btn-delete { background: #f8d7da; color: #721c24; }
        .btn-delete:hover { background: #f1aeb5; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; width: 700px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
        .modal-header h2 { margin: 0; font-size: 24px; color: #2c3e50; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .modal-close:hover { color: #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .form-control:focus { outline: none; border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-inactive { background: #f8d7da; color: #721c24; }
        .badge-admin { background: #f093fb; color: white; }
        .badge-employee { background: #4facfe; color: white; }
        .badge-customer { background: #43e97b; color: white; }
        .avatar-placeholder { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
    <link th:href="@{/css/index.css}" rel="stylesheet">
    <link th:href="@{/css/admin/index.css}" rel="stylesheet">
    <link th:href="@{/css/admin/sidebar.css}" rel="stylesheet">
</head>
<body>
<div id="adminShell" class="admin-shell">
    <div th:replace="~{/components/adminSidebar.html}"></div>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-users"></i> Quản lý Tài khoản</h1>
            <button onclick="showAddModal()" class="btn btn-primary"><i class="fas fa-user-plus"></i> Thêm người dùng</button>
        </div>

        <div id="alertContainer"></div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-card-title">Tổng người dùng</div>
                <div class="stat-number" id="statTotalUsers" style="color: #667eea;">0</div>
            </div>
            <div class="stat-card admin">
                <div class="stat-card-title">Admin</div>
                <div class="stat-number" id="statTotalAdmins" style="color: #f093fb;">0</div>
            </div>
            <div class="stat-card employee">
                <div class="stat-card-title">Nhân viên</div>
                <div class="stat-number" id="statTotalEmployees" style="color: #4facfe;">0</div>
            </div>
            <div class="stat-card customer">
                <div class="stat-card-title">Khách hàng</div>
                <div class="stat-number" id="statTotalCustomers" style="color: #43e97b;">0</div>
            </div>
        </div>

        <div class="filter-bar">
            <div>
                <label>Lọc theo vai trò:</label>
                <select id="filterRole" onchange="loadUsers()" class="form-control" style="width: auto; min-width: 150px;">
                    <option value="all">Tất cả vai trò</option>
                    <option value="admin">Admin</option>
                    <option value="employee">Nhân viên</option>
                    <option value="customer">Khách hàng</option>
                </select>
            </div>
            <div>
                <label>Lọc theo trạng thái:</label>
                <select id="filterStatus" onchange="loadUsers()" class="form-control" style="width: auto; min-width: 150px;">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active">Đang hoạt động</option>
                    <option value="inactive">Đã khóa</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên, email, SĐT..." 
                       class="form-control" onkeyup="debounceSearch()">
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Họ Tên</th>
                    <th>Email</th>
                    <th>Số ĐT</th>
                    <th>Vai Trò</th>
                    <th>Trạng Thái</th>
                    <th>Ngày Tạo</th>
                    <th>Hành Động</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                <tr>
                    <td colspan="8" class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Đang tải dữ liệu...</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Add/Edit User -->
<div id="userModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Thêm người dùng mới</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <form id="userForm" onsubmit="saveUser(event)">
            <input type="hidden" id="userId">
            <input type="hidden" id="currentUserRole">
            
            <div class="form-row">
                <div class="form-group">
                    <label>Họ Tên <span style="color:red">*</span></label>
                    <input type="text" id="userName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email <span style="color:red">*</span></label>
                    <input type="email" id="userEmail" class="form-control" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Số Điện Thoại</label>
                    <input type="text" id="userPhone" class="form-control">
                </div>
                <div class="form-group">
                    <label>Vai Trò <span style="color:red">*</span></label>
                    <select id="userRole" class="form-control" required onchange="togglePasswordField()">
                        <option value="admin">Admin</option>
                        <option value="employee">Nhân Viên</option>
                        <option value="customer">Khách Hàng</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group" id="passwordField">
                <label>Mật Khẩu <span style="color:red">*</span></label>
                <input type="password" id="userPassword" class="form-control">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Ngày Sinh</label>
                    <input type="date" id="userDateOfBirth" class="form-control">
                </div>
                <div class="form-group">
                    <label>Giới Tính</label>
                    <select id="userGender" class="form-control">
                        <option value="">Chọn giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Địa Chỉ</label>
                <textarea id="userAddress" class="form-control" rows="2"></textarea>
            </div>
            
            <div class="form-group">
                <label>Ghi chú / Chức vụ</label>
                <textarea id="userNotes" class="form-control" rows="2"></textarea>
            </div>
            
            <div class="form-group">
                <label>Trạng Thái <span style="color:red">*</span></label>
                <select id="userStatus" class="form-control" required>
                    <option value="active">Đang hoạt động</option>
                    <option value="inactive">Đã khóa</option>
                </select>
            </div>
            
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top: 30px;">
                <button type="button" onclick="closeModal()" class="btn" style="background:#999;color:white;">Hủy</button>
                <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal View User -->
<div id="viewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Chi tiết người dùng</h2>
            <button class="modal-close" onclick="closeViewModal()">&times;</button>
        </div>
        <div id="viewModalBody"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top: 20px;">
            <button onclick="closeViewModal()" class="btn" style="background:#999;color:white;">Đóng</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/admin/users/api';
    let debounceTimer;

    // Load statistics
    async function loadStatistics() {
        try {
            const res = await fetch(`${API_BASE}/statistics`);
            if (!res.ok) throw new Error('Không lấy được thống kê');
            const stats = await res.json();
            
            document.getElementById('statTotalUsers').textContent = stats.totalUsers || 0;
            document.getElementById('statTotalAdmins').textContent = stats.totalAdmins || 0;
            document.getElementById('statTotalEmployees').textContent = stats.totalEmployees || 0;
            document.getElementById('statTotalCustomers').textContent = stats.totalCustomers || 0;
        } catch (err) {
            console.error('Error loading statistics:', err);
        }
    }

    // Load users
    async function loadUsers() {
        const role = document.getElementById('filterRole').value;
        const status = document.getElementById('filterStatus').value;
        const search = document.getElementById('searchInput').value;
        
        const roleParam = role === 'all' ? '' : role;
        const statusParam = status === 'all' ? '' : status;
        const keywordParam = search || '';
        
        try {
            let url = `${API_BASE}/filter?`;
            if (roleParam) url += `role=${roleParam}&`;
            if (statusParam) url += `status=${statusParam}&`;
            if (keywordParam) url += `keyword=${keywordParam}&`;
            
            const res = await fetch(url);
            if (!res.ok) throw new Error('Không lấy được dữ liệu');
            
            const users = await res.json();
            renderUserTable(users);
        } catch (err) {
            console.error('Error loading users:', err);
            showAlert('Lỗi khi tải dữ liệu người dùng.', 'error');
            document.getElementById('usersTableBody').innerHTML = 
                '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Lỗi khi tải dữ liệu</p></td></tr>';
        }
    }

    // Render user table
    function renderUserTable(users) {
        const tbody = document.getElementById('usersTableBody');
        if (!users || users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-users"></i><p>Không có người dùng nào</p></td></tr>';
            return;
        }
        
        tbody.innerHTML = users.map((u, index) => {
            const avatar = `<div class="avatar-placeholder">${(u.name || '?').charAt(0).toUpperCase()}</div>`;
            const roleBadge = getRoleBadge(u.role);
            const statusBadge = u.status === 'active' 
                ? '<span class="badge badge-active">Đang hoạt động</span>' 
                : '<span class="badge badge-inactive">Đã khóa</span>';
            const createdDate = u.createdAt ? new Date(u.createdAt).toLocaleDateString('vi-VN') : '';
            
            return `
                <tr>
                    <td>${avatar}</td>
                    <td><strong>${u.name || ''}</strong></td>
                    <td>${u.email || ''}</td>
                    <td>${u.phone || '-'}</td>
                    <td>${roleBadge}</td>
                    <td>${statusBadge}</td>
                    <td>${createdDate}</td>
                    <td>
                        <button class="btn-action btn-view" onclick="viewUser(${u.id}, '${u.role}')" title="Xem">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn-action btn-edit" onclick="editUser(${u.id}, '${u.role}')" title="Sửa">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteUser(${u.id}, '${u.role}', '${(u.name || '').replace(/'/g, "\\'")}')" title="Xóa">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function getRoleBadge(role) {
        switch(role) {
            case 'admin': return '<span class="badge badge-admin">Admin</span>';
            case 'employee': return '<span class="badge badge-employee">Nhân viên</span>';
            case 'customer': return '<span class="badge badge-customer">Khách hàng</span>';
            default: return '<span class="badge">' + role + '</span>';
        }
    }

    // Show add modal
    function showAddModal() {
        document.getElementById('modalTitle').textContent = 'Thêm người dùng mới';
        document.getElementById('userForm').reset();
        document.getElementById('userId').value = '';
        document.getElementById('currentUserRole').value = '';
        document.getElementById('passwordField').style.display = 'block';
        document.getElementById('userPassword').required = true;
        document.getElementById('userModal').style.display = 'flex';
    }

    // Edit user
    async function editUser(id, role) {
        try {
            const res = await fetch(`${API_BASE}/${id}?role=${role}`);
            if (!res.ok) throw new Error('Không tải được thông tin người dùng');
            
            const user = await res.json();
            
            document.getElementById('modalTitle').textContent = 'Cập nhật người dùng';
            document.getElementById('userId').value = id;
            document.getElementById('currentUserRole').value = role;
            document.getElementById('userName').value = user.name || '';
            document.getElementById('userEmail').value = user.email || '';
            document.getElementById('userPhone').value = user.phone || '';
            document.getElementById('userRole').value = user.role || '';
            document.getElementById('userStatus').value = user.status || 'active';
            document.getElementById('userAddress').value = user.address || '';
            document.getElementById('userNotes').value = user.notes || '';
            document.getElementById('userGender').value = user.gender || '';
            
            if (user.dateOfBirth) {
                const date = new Date(user.dateOfBirth);
                document.getElementById('userDateOfBirth').value = date.toISOString().split('T')[0];
            }
            
            document.getElementById('passwordField').style.display = 'none';
            document.getElementById('userPassword').required = false;
            document.getElementById('userModal').style.display = 'flex';
        } catch (err) {
            console.error('Error loading user:', err);
            showAlert('Lỗi khi tải thông tin người dùng.', 'error');
        }
    }

    // View user
    async function viewUser(id, role) {
        try {
            const res = await fetch(`${API_BASE}/${id}?role=${role}`);
            if (!res.ok) throw new Error('Không tải được thông tin người dùng');
            
            const user = await res.json();
            
            const html = `
                <div style="display: grid; gap: 15px;">
                    <div><strong>Họ Tên:</strong> ${user.name || '-'}</div>
                    <div><strong>Email:</strong> ${user.email || '-'}</div>
                    <div><strong>Số ĐT:</strong> ${user.phone || '-'}</div>
                    <div><strong>Vai Trò:</strong> ${getRoleBadge(user.role)}</div>
                    <div><strong>Trạng Thái:</strong> ${user.status === 'active' ? '<span class="badge badge-active">Đang hoạt động</span>' : '<span class="badge badge-inactive">Đã khóa</span>'}</div>
                    <div><strong>Địa Chỉ:</strong> ${user.address || '-'}</div>
                    <div><strong>Ghi chú:</strong> ${user.notes || '-'}</div>
                    <div><strong>Ngày Sinh:</strong> ${user.dateOfBirth ? new Date(user.dateOfBirth).toLocaleDateString('vi-VN') : '-'}</div>
                    <div><strong>Giới Tính:</strong> ${user.gender || '-'}</div>
                    <div><strong>Ngày Tạo:</strong> ${user.createdAt ? new Date(user.createdAt).toLocaleString('vi-VN') : '-'}</div>
                </div>
            `;
            
            document.getElementById('viewModalBody').innerHTML = html;
            document.getElementById('viewModal').style.display = 'flex';
        } catch (err) {
            console.error('Error loading user:', err);
            showAlert('Lỗi khi tải thông tin người dùng.', 'error');
        }
    }

    // Delete user
    async function deleteUser(id, role, userName) {
        if (!confirm(`Bạn có chắc chắn muốn xóa người dùng "${userName}"?`)) {
            return;
        }
        
        try {
            const res = await fetch(`${API_BASE}/delete/${id}?role=${role}`, {
                method: 'DELETE'
            });
            
            const result = await res.json();
            
            if (res.ok) {
                showAlert('Xóa người dùng thành công!', 'success');
                loadUsers();
                loadStatistics();
            } else {
                showAlert(result.error || 'Lỗi khi xóa người dùng.', 'error');
            }
        } catch (err) {
            console.error('Error deleting user:', err);
            showAlert('Lỗi khi xóa người dùng.', 'error');
        }
    }

    // Save user
    async function saveUser(event) {
        event.preventDefault();
        
        const userId = document.getElementById('userId').value;
        const userData = {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            phone: document.getElementById('userPhone').value,
            role: document.getElementById('userRole').value,
            status: document.getElementById('userStatus').value,
            address: document.getElementById('userAddress').value,
            notes: document.getElementById('userNotes').value,
            gender: document.getElementById('userGender').value,
            dateOfBirth: document.getElementById('userDateOfBirth').value || null
        };
        
        if (!userId) {
            // Create new user
            userData.password = document.getElementById('userPassword').value;
            if (!userData.password) {
                showAlert('Vui lòng nhập mật khẩu.', 'error');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const result = await res.json();
                
                if (res.ok) {
                    showAlert('Thêm người dùng thành công!', 'success');
                    closeModal();
                    loadUsers();
                    loadStatistics();
                } else {
                    showAlert(result.error || 'Lỗi khi thêm người dùng.', 'error');
                }
            } catch (err) {
                console.error('Error creating user:', err);
                showAlert('Lỗi khi thêm người dùng.', 'error');
            }
        } else {
            // Update user
            const role = document.getElementById('currentUserRole').value;
            
            try {
                const res = await fetch(`${API_BASE}/update/${userId}?role=${role}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const result = await res.json();
                
                if (res.ok) {
                    showAlert('Cập nhật người dùng thành công!', 'success');
                    closeModal();
                    loadUsers();
                    loadStatistics();
                } else {
                    showAlert(result.error || 'Lỗi khi cập nhật người dùng.', 'error');
                }
            } catch (err) {
                console.error('Error updating user:', err);
                showAlert('Lỗi khi cập nhật người dùng.', 'error');
            }
        }
    }

    // Close modal
    function closeModal() {
        document.getElementById('userModal').style.display = 'none';
        document.getElementById('userForm').reset();
    }

    function closeViewModal() {
        document.getElementById('viewModal').style.display = 'none';
    }

    function togglePasswordField() {
        const userId = document.getElementById('userId').value;
        if (!userId) {
            document.getElementById('passwordField').style.display = 'block';
            document.getElementById('userPassword').required = true;
        }
    }

    // Debounce search
    function debounceSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(loadUsers, 500);
    }

    // Show alert
    function showAlert(message, type) {
        const alertContainer = document.getElementById('alertContainer');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        const alert = document.createElement('div');
        alert.className = `alert ${alertClass}`;
        alert.textContent = message;
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alert);
        
        setTimeout(() => {
            alert.style.transition = 'opacity 0.5s';
            alert.style.opacity = '0';
            setTimeout(() => alert.remove(), 500);
        }, 3000);
    }

    // Close modal on outside click
    window.onclick = function(event) {
        const userModal = document.getElementById('userModal');
        const viewModal = document.getElementById('viewModal');
        if (event.target == userModal) closeModal();
        if (event.target == viewModal) closeViewModal();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        loadStatistics();
        loadUsers();
    });
</script>
</body>
</html>

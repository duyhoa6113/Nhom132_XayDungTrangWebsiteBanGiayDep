<!-- templates/components/adminSidebar.html -->
<aside class="admin-sidebar">
    <div class="admin-brand">
        <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
        <span class="logo-text">Admin Panel</span>
    </div>

    <ul class="admin-nav ps-0">
        <li class="nav-item">
            <a th:href="@{/admin/dashboard}" th:classappend="${page} == 'dashboard' ? ' active' : ''" class="nav-link">
                <i class="fa-solid fa-gauge-high"></i><span class="text">Dashboard</span>
            </a>
        </li>

        <li class="nav-item nav-has-children"
            th:classappend="${page == 'products' or page == 'product_attributes' or page == 'categories' ? ' open' : ''}">

            <div class="nav-link-wrapper">
                <a th:href="@{/admin/products}" th:classappend="${page} == 'products' ? ' active' : ''"
                    class="nav-link">
                    <i class="fa-solid fa-shoe-prints"></i><span class="text">Sản phẩm</span>
                </a>
                <button type="button" class="btn-toggle" aria-expanded="false" aria-controls="productsSubmenu"
                    title="Mở/đóng">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>

            <ul class="submenu ps-0" id="productsSubmenu" hidden>
                <li class="nav-subitem">
                    <a th:href="@{/admin/products}" th:classappend="${page} == 'products' ? ' active' : ''"
                        class="nav-sublink">
                        <span class="sublink-bullet"></span>
                        <span class="sublink-text">Tất cả sản phẩm</span>
                    </a>
                </li>
                <li class="nav-subitem">
                    <a th:href="@{/admin/products/colors}"
                        th:classappend="${page == 'product_attributes' and subpage == 'colors' ? ' active' : ''}"
                        class="nav-sublink">
                        <span class="sublink-bullet"></span>
                        <span class="sublink-text">Màu sắc</span>
                    </a>
                </li>
                <li class="nav-subitem">
                    <a th:href="@{/admin/products/materials}"
                        th:classappend="${page == 'product_attributes' and subpage == 'materials' ? ' active' : ''}"
                        class="nav-sublink">
                        <span class="sublink-bullet"></span>
                        <span class="sublink-text">Chất liệu</span>
                    </a>
                </li>
                <li class="nav-subitem">
                    <a th:href="@{/admin/products/sizes}"
                        th:classappend="${page == 'product_attributes' and subpage == 'sizes' ? ' active' : ''}"
                        class="nav-sublink">
                        <span class="sublink-bullet"></span>
                        <span class="sublink-text">Kích thước</span>
                    </a>
                </li>
                <li class="nav-subitem">
                    <a th:href="@{/admin/products/brands}"
                        th:classappend="${page == 'product_attributes' and subpage == 'brands' ? ' active' : ''}"
                        class="nav-sublink">
                        <span class="sublink-bullet"></span>
                        <span class="sublink-text">Thương hiệu</span>
                    </a>
                </li>
                <li class="nav-subitem">
                    <a th:href="@{/admin/categories}" th:classappend="${page} == 'categories' ? ' active' : ''"
                        class="nav-sublink">
                        <span class="sublink-bullet"></span>
                        <span class="sublink-text">Danh mục</span>
                    </a>
                </li>
            </ul>
        </li>

        <li class="nav-item">
            <a th:href="@{/admin/orders}" th:classappend="${page} == 'orders' ? ' active' : ''" class="nav-link">
                <i class="fa-solid fa-receipt"></i><span class="text">Đơn hàng</span>
            </a>
        </li>

        <li class="nav-item">
            <a th:href="@{/admin/role}" th:classappend="${page} == 'role' ? ' active' : ''" class="nav-link">
                <i class="fa-solid fa-users"></i><span class="text">Tài khoản</span>
            </a>
        </li>
    </ul>

    <div class="admin-footer">
        <button type="button" class="sidebar-toggle" id="btnSidebarToggle">
            <i class="fa-solid fa-angles-left"></i><span class="text">Thu gọn</span>
        </button>
    </div>

    <style>
        /* Base Nav Link Styles */
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: rgba(0, 0, 0, 0.75);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            position: relative;
        }

        .nav-link i {
            width: 20px;
            font-size: 18px;
            color: rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background: #fff7f6;
            color: #f63;
            border-color: rgba(246, 51, 51, 0.1);
        }

        .nav-link:hover i {
            color: #f63;
            transform: scale(1.1);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #f53d2d 0%, #f63 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(246, 51, 51, 0.25);
            font-weight: 600;
        }

        .nav-link.active i {
            color: #fff;
        }

        /* Nav Has Children - Wrapper */
        .nav-has-children .nav-link-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-has-children .nav-link {
            flex: 1;
            margin: 0;
        }

        .nav-has-children .btn-toggle {
            border: none;
            background: transparent;
            padding: 8px;
            cursor: pointer;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
        }

        .nav-has-children .btn-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
            color: rgba(0, 0, 0, 0.8);
        }

        .nav-has-children.open .btn-toggle i {
            transform: rotate(180deg);
        }

        .nav-has-children .btn-toggle i {
            transition: transform 0.2s ease;
        }

        /* Submenu Styles */
        .submenu {
            list-style: none;
            margin: 8px 0 0 0;
            padding: 0 0 0 32px;
            position: relative;
        }

        .submenu::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, 
                rgba(246, 51, 51, 0.15) 0%, 
                rgba(246, 51, 51, 0.05) 100%);
            border-radius: 2px;
        }

        .nav-subitem {
            margin: 4px 0;
        }

        .nav-sublink {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: rgba(0, 0, 0, 0.7);
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            position: relative;
        }

        .sublink-bullet {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .nav-sublink:hover {
            background: #fff7f6;
            color: #f63;
            border-color: rgba(246, 51, 51, 0.1);
            transform: translateX(4px);
        }

        .nav-sublink:hover .sublink-bullet {
            background: #f63;
            transform: scale(1.3);
        }

        .nav-sublink.active {
            background: linear-gradient(135deg, #f53d2d 0%, #f63 100%);
            color: #fff;
            box-shadow: 0 3px 10px rgba(246, 51, 51, 0.2);
            font-weight: 600;
        }

        .nav-sublink.active .sublink-bullet {
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        /* Collapsed State */
        #adminShell.collapsed .submenu {
            display: none !important;
        }

        #adminShell.collapsed .btn-toggle {
            display: none;
        }

        #adminShell.collapsed .nav-link-wrapper {
            flex-direction: column;
        }

        /* Spacing */
        .nav-item {
            margin: 4px 0;
        }

        .nav-item:not(:last-child) {
            margin-bottom: 6px;
        }

        /* Animation for submenu */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .submenu:not([hidden]) {
            animation: slideDown 0.2s ease;
        }
    </style>

    <script>
        document.getElementById('btnSidebarToggle')?.addEventListener('click', () => {
            const shell = document.getElementById('adminShell');
            if (!shell) return;
            shell.classList.toggle('collapsed');
            const icon = document.querySelector('#btnSidebarToggle i');
            const text = document.querySelector('#btnSidebarToggle .text');
            if (shell.classList.contains('collapsed')) {
                icon.classList.remove('fa-angles-left'); icon.classList.add('fa-angles-right');
                if (text) text.textContent = 'Mở rộng';
            } else {
                icon.classList.remove('fa-angles-right'); icon.classList.add('fa-angles-left');
                if (text) text.textContent = 'Thu gọn';
            }
        });

        (function () {
            const parentItems = document.querySelectorAll('.nav-has-children');
            parentItems.forEach(parent => {
                const toggleBtn = parent.querySelector('.btn-toggle');
                const submenu = parent.querySelector('.submenu');

                if (!toggleBtn || !submenu) return;

                const isOpen = parent.classList.contains('open');
                toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                if (isOpen) {
                    submenu.hidden = false;
                } else {
                    submenu.hidden = true;
                }

                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
                    if (expanded) {
                        parent.classList.remove('open');
                        toggleBtn.setAttribute('aria-expanded', 'false');
                        submenu.hidden = true;
                    } else {
                        parent.classList.add('open');
                        toggleBtn.setAttribute('aria-expanded', 'true');
                        submenu.hidden = false;
                    }
                });

                document.addEventListener('click', function (ev) {
                    if (!parent.contains(ev.target)) {
                        parent.classList.remove('open');
                        toggleBtn.setAttribute('aria-expanded', 'false');
                        submenu.hidden = true;
                    }
                });
            });
        })();
    </script>
</aside>
